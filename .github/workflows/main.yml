name: Build ClockGlass
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unpack project zip
        run: |
          rm -rf proj
          mkdir proj
          unzip -o -q ClockGlass-src.zip -d proj
          SETTINGS=$(find proj -maxdepth 2 -name settings.gradle.kts | head -n 1)
          echo "PROJ_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        working-directory: ${{ env.PROJ_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp "$PROJ_DIR/app/build/outputs/apk/debug/app-debug.apk" out/ClockGlass.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ClockGlass-APK
          path: out/ClockGlass.apk
